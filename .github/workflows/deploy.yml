name: deploy

# DEPLOY (#28) — control-plane Worker + same-origin SPA to Cloudflare.
# Manual only (workflow_dispatch): deploying is an explicit operator action, never automatic on push.
# Auth uses the repo's existing CLOUDFLARE_API_TOKEN secret + CLOUDFLARE_ACCOUNT_ID var — the token is
# never exposed to the agent; it lives in GitHub Actions. The token MUST carry Workers Scripts:Edit,
# D1:Edit, KV:Edit, R2:Edit, Queues:Edit and Zone/Workers Routes for the custom domain — `mode: probe`
# prints what it can see so an under-scoped token is diagnosed before a real deploy.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe | migrate | secrets | cors (set R2 bucket CORS) | deploy (build SPA + wrangler deploy)"
        type: choice
        options: [probe, migrate, secrets, cors, deploy]
        default: probe

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-plane
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "11.8.0" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Probe — identity + resource visibility (no changes)
        run: |
          echo "== whoami =="; pnpm dlx wrangler@4 whoami || true
          echo "== d1 =="; pnpm dlx wrangler@4 d1 list || true
          echo "== kv =="; pnpm dlx wrangler@4 kv namespace list || true
          echo "== r2 =="; pnpm dlx wrangler@4 r2 bucket list || true
          echo "== queues =="; pnpm dlx wrangler@4 queues list || true

      - name: Apply D1 migrations (remote)
        if: ${{ inputs.mode == 'migrate' }}
        run: pnpm dlx wrangler@4 d1 migrations apply ovt-db --remote

      # Inject the SELF-GENERATED plain secrets (not owner-provided; those live in the Secrets Store).
      # Values come from repo secrets set out-of-band; piped via stdin so they never appear in a command
      # line or log. INTERNAL_TOKEN must match the VPS worker's OVT_INTERNAL_TOKEN; ANON_ID_HMAC_KEY
      # opens the prod actor surface (signed anon ids); ADMIN_TOKEN gates /internal/admin/* + sweep.yml.
      - name: Put self-generated secrets
        if: ${{ inputs.mode == 'secrets' }}
        env:
          INTERNAL_TOKEN: ${{ secrets.INTERNAL_TOKEN }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          ANON_ID_HMAC_KEY: ${{ secrets.ANON_ID_HMAC_KEY }}
        run: |
          printf %s "$INTERNAL_TOKEN"   | pnpm dlx wrangler@4 secret put INTERNAL_TOKEN
          printf %s "$ADMIN_TOKEN"      | pnpm dlx wrangler@4 secret put ADMIN_TOKEN
          printf %s "$ANON_ID_HMAC_KEY" | pnpm dlx wrangler@4 secret put ANON_ID_HMAC_KEY

      # Browser uploads go direct to R2 via a presigned PUT (cross-origin), so the bucket needs a CORS
      # policy allowing PUT/GET from the site origin — otherwise the browser preflight 403s and the
      # upload fails with a generic network error (server-side curl bypasses CORS, so it isn't caught
      # by the API smoke). Idempotent: re-setting overwrites the same policy.
      - name: Set R2 bucket CORS
        if: ${{ inputs.mode == 'cors' }}
        run: pnpm dlx wrangler@4 r2 bucket cors set ovt-artifacts --file deploy/cloudflare/r2-cors.json --force
        working-directory: .

      - name: Build SPA (same-origin assets)
        if: ${{ inputs.mode == 'deploy' }}
        run: pnpm --filter @open-video-trans/web build
        working-directory: .
        env:
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - name: Deploy Worker
        if: ${{ inputs.mode == 'deploy' }}
        run: pnpm dlx wrangler@4 deploy
