name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # ── TypeScript job ─────────────────────────────────────────────────────────
  ts:
    name: TS (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.8.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # CFG-GUARD §14 guard: a named, visible gate asserting no red-line key is runtime-mutable
      # (paid-API gating §1 / AIGC legal marking §3). Fails loudly if a red-line key ever enters the
      # operator-mutable settings allowlist. (Also covered by `pnpm test`; this makes it explicit.)
      - name: CFG-GUARD §14 red-line invariant
        run: pnpm --filter @open-video-trans/control-plane exec vitest run test/settings.guard.test.ts

      # FREE-POOL §23 guard: a named, visible gate asserting the free-pool circuit-breaker never
      # admits a paid provider (the free set is disjoint from the paid set, and a paid name is
      # rejected 403 at the report route). Fails loudly if a paid provider ever leaks into the
      # free-pool state surface (red line §1/§14). (Also covered by `pnpm test`; this makes it explicit.)
      - name: FREE-POOL §23 red-line invariant
        run: pnpm --filter @open-video-trans/control-plane exec vitest run test/providers.guard.test.ts

  # ── Python job ─────────────────────────────────────────────────────────────
  py:
    name: Py (ruff + pytest + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"

      - name: Install dependencies (frozen)
        run: uv sync --all-packages --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

      - name: Pyright typecheck
        run: uv run pyright packages/autodub-core packages/provider-adapters workers/media-worker cli/local-runner packages/schemas apps/control-plane/spike tooling/guardrails

  # ── Schema codegen-diff job ────────────────────────────────────────────────
  schema:
    name: Schema codegen-diff (no drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run codegen
        run: node packages/schemas/scripts/codegen.mjs

      - name: Assert no drift
        run: >
          git diff --exit-code --
          packages/schemas/generated/ts/contracts.ts
          packages/schemas/src/ovt_schemas/contracts.py

  # ── Red-line guardrail job (paid-provider safety §5 + autodub-core boundary) ─
  redline:
    name: Red-line guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"

      - name: Install dependencies (frozen)
        run: uv sync --all-packages --frozen

      # Paid-safety invariants (§5) + the autodub-core boundary lint — both HARD-PASS since T1.2
      # (the early xfail scaffolding is gone; redline must stay 25 passed / 0 xfail).
      - name: Red-line invariants (paid-safety §5 + autodub-core boundary)
        run: uv run pytest -m redline

  # ── SSRF / presign guardrail job (T2.4: no yt-dlp / ffmpeg+egress allowlist / presign binding) ─
  guardrails:
    name: SSRF / presign guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"

      # Stdlib-only structural scan of the hosted source: no URL-ingest tool, ffmpeg protocol/format
      # allowlist + worker ffprobe re-admission wiring, default-drop egress (IMDS/RFC1918 blocked),
      # and the presign binding (HEAD-before-create / short-lived PUT / derived key / guarded GET).
      - name: SSRF + presign invariants
        run: uv run python tooling/guardrails/ssrf_presign_check.py
