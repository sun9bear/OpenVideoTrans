name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # ── TypeScript job ─────────────────────────────────────────────────────────
  ts:
    name: TS (lint + typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: "11.8.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  # ── Python job ─────────────────────────────────────────────────────────────
  py:
    name: Py (ruff + pytest + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"

      - name: Install dependencies (frozen)
        run: uv sync --all-packages --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest

      - name: Pyright typecheck
        run: uv run pyright packages/autodub-core packages/provider-adapters workers/media-worker cli/local-runner packages/schemas

  # ── Schema codegen-diff job ────────────────────────────────────────────────
  schema:
    name: Schema codegen-diff (no drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run codegen
        run: node packages/schemas/scripts/codegen.mjs

      - name: Assert no drift
        run: >
          git diff --exit-code --
          packages/schemas/generated/ts/contracts.ts
          packages/schemas/src/ovt_schemas/contracts.py
