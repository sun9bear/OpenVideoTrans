[project]
name = "media-worker"
version = "0.0.1"
description = "Media worker (T2.2 stub: claim -> copy source to artifact -> complete) for OpenVideoTrans (Tier 1)"
requires-python = ">=3.11"
# Zero third-party deps: the worker talks to the control plane and R2 over the Python stdlib only
# (urllib for HTTP, hmac/hashlib for SigV4), so the deployed box has no extra supply-chain surface.
# `ovt-schemas` parses the claimed Job (shared contract, no drift); `autodub-core` is reused only for
# its proven path-isolation guards (safe_component / ensure_within) — the stub does NOT run the
# kernel pipeline (that is M2-CLOSE). The worker is an orchestrator-side consumer, so importing the
# kernel is an inbound edge and does not breach the kernel's own no-gateway/no-provider boundary.
dependencies = ["ovt-schemas", "autodub-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_worker"]

[tool.uv.sources]
ovt-schemas = { workspace = true }
autodub-core = { workspace = true }
