[project]
name = "media-worker"
version = "0.0.1"
description = "Media worker (claim -> run autodub-core pipeline with free-pool routing -> complete) for OpenVideoTrans (Tier 1)"
requires-python = ">=3.11"
# The worker talks to the control plane and R2 over the Python stdlib (urllib for HTTP, hmac/hashlib
# for SigV4). `ovt-schemas` parses the claimed Job (shared contract, no drift); `autodub-core` runs
# the real pipeline (M2-CLOSE) + provides the path-isolation guards (safe_component / ensure_within);
# `provider-adapters` supplies the FREE-POOL router (route_free) + the real ASR/MT/TTS adapters, which
# lazy-import `requests` for the cloud providers (Groq/Cloudflare/DeepL) — so the worker, the
# deployment that actually RUNS them, declares `requests` even though provider-adapters keeps it
# optional. The worker is an orchestrator-side consumer: it may import BOTH the kernel AND the
# adapters, but neither imports the other (the seam stays structural) and neither imports the
# gateway/billing/control-plane (kernel hard boundary preserved).
dependencies = ["ovt-schemas", "autodub-core", "provider-adapters", "requests>=2.31"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/media_worker"]

[tool.uv.sources]
ovt-schemas = { workspace = true }
autodub-core = { workspace = true }
provider-adapters = { workspace = true }
