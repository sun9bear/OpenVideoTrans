[project]
name = "open-video-trans-workspace"
version = "0.0.1"
description = "Workspace root — dev tooling only, not published"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.5.0", "pyright>=1.1.0", "pytest>=8.0.0"]

[tool.uv.workspace]
members = [
    "packages/schemas",
    "packages/autodub-core",
    "packages/provider-adapters",
    "workers/media-worker",
    "cli/local-runner",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
testpaths = [
    "packages/schemas/tests",
    "packages/autodub-core/tests",
    "packages/provider-adapters/tests",
    "workers/media-worker/tests",
    "cli/local-runner/tests",
]
addopts = "-v --import-mode=importlib"
