[project]
name = "autodub-core"
version = "0.0.1"
description = "Language-agnostic video translation + dubbing kernel for OpenVideoTrans (Tier 1)"
requires-python = ">=3.11"
dependencies = ["ovt-schemas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autodub_core"]

[tool.uv.sources]
ovt-schemas = { workspace = true }
