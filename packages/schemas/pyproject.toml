[project]
name = "ovt-schemas"
version = "0.0.1"
description = "Generated Pydantic v2 contracts for OpenVideoTrans"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ovt_schemas"]
